{% extends "base.html" %}
{% block title %}Submit Score — {{ tournament.name }}{% endblock %}

{% block content %}
<h1>Submit Score</h1>
<p style="color:var(--t2);margin-top:-12px;margin-bottom:28px;font-size:14px">{{ tournament.name }}</p>

{% if error %}
  <div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('tournaments.submit', tournament_id=tournament.id) }}" id="submit-form">
  <div class="form-group">
    <label for="share_text">Paste your Wordle share text</label>
    <textarea
      id="share_text"
      name="share_text"
      rows="8"
      class="share-textarea"
      placeholder="Wordle 1,801 3/6*&#10;⬜⬜⬜🟨🟩&#10;🟨⬜⬜🟩🟩&#10;🟩🟩🟩🟩🟩"
      required
    >{{ share_text or '' }}</textarea>
  </div>

  <!-- Live preview box -->
  <div id="preview" style="display:none;margin-bottom:20px;padding:14px 16px;
       background:var(--t6);border:1px solid var(--t5);border-radius:var(--r)">
    <div style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
                color:var(--t2);margin-bottom:10px">Preview</div>
    <div id="preview-content"></div>
    <div id="preview-error" style="color:var(--error);font-size:13px;font-weight:700"></div>
  </div>

  <div class="form-group">
    <label for="comment">Comment <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <input type="text" id="comment" name="comment" maxlength="280"
           placeholder="How'd it go?" value="{{ request.form.get('comment','') }}">
  </div>

  <button type="submit" id="submit-btn" class="btn btn-primary">Submit Score</button>
</form>

<div style="margin-top:20px">
  <a href="{{ url_for('tournaments.detail', tournament_id=tournament.id) }}"
     style="font-size:13px;color:var(--t2)">← Back to tournament</a>
</div>
{% endblock %}

{% block scripts %}
<script>
const HEADER_RE = /^Wordle\s+(?:#TODAY|#?([\d,]+))\s+(X|\d)\/6(\*)?/m;
const textarea   = document.getElementById('share_text');
const preview    = document.getElementById('preview');
const pContent   = document.getElementById('preview-content');
const pError     = document.getElementById('preview-error');
const submitBtn  = document.getElementById('submit-btn');

function updatePreview() {
  const text = textarea.value;
  if (!text.trim()) {
    preview.style.display = 'none';
    submitBtn.disabled = false;
    return;
  }
  preview.style.display = 'block';
  const m = text.match(HEADER_RE);
  if (!m) {
    pContent.innerHTML = '';
    pError.textContent = 'Could not find a Wordle score header.';
    submitBtn.disabled = true;
    return;
  }
  if (!m[3]) {
    pContent.innerHTML = '';
    pError.textContent = 'Hard Mode (*) is required. Enable Hard Mode in the Wordle app and try again.';
    submitBtn.disabled = true;
    return;
  }
  pError.textContent = '';
  const puzzle  = m[1] ? m[1].replace(/,/g, '') : 'TODAY';
  const guesses = m[2] === 'X' ? 0 : parseInt(m[2], 10);
  const guessLabel = guesses === 0
    ? '<span style="color:var(--color-absent);font-weight:700">MISS</span>'
    : `<strong>${guesses}</strong> guess${guesses !== 1 ? 'es' : ''}`;
  pContent.innerHTML = `
    <div style="font-size:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <span>Puzzle <strong>#${puzzle}</strong></span>
      <span>${guessLabel}</span>
      <span style="color:var(--color-correct);font-weight:700;font-size:13px">✓ Hard Mode</span>
    </div>`;
  submitBtn.disabled = false;
}

textarea.addEventListener('input', updatePreview);
updatePreview();
</script>
{% endblock %}
