{% extends "base.html" %}
{% block title %}New Tournament — Wordle Tournament{% endblock %}

{% block content %}
<h1>Create Tournament</h1>

{% for e in (errors or []) %}
  <div class="alert alert-error">{{ e }}</div>
{% endfor %}

<form method="post" action="{{ url_for('tournaments.new') }}">
  <div class="form-group">
    <label for="name">Tournament name</label>
    <input type="text" id="name" name="name" value="{{ form.get('name','') }}"
           placeholder="e.g. May 2026 Championship" maxlength="100" required autofocus>
  </div>

  <div class="form-group">
    <label for="start_puzzle">
      Starting Wordle #
      <span style="font-weight:400;text-transform:none;letter-spacing:0">(today is #{{ today_puzzle }})</span>
    </label>
    <input type="number" id="start_puzzle" name="start_puzzle"
           value="{{ form.get('start_puzzle', today_puzzle) }}"
           min="1" required>
  </div>

  <div class="form-group">
    <label for="num_days">Duration (days)</label>
    <input type="number" id="num_days" name="num_days"
           value="{{ form.get('num_days', 7) }}"
           min="1" max="365" required>
  </div>

  <button type="submit" class="btn btn-primary">Create Tournament</button>
</form>

<div style="margin-top:20px">
  <a href="{{ url_for('ui.dashboard') }}" style="font-size:13px;color:var(--t2)">← Back to dashboard</a>
</div>
{% endblock %}
