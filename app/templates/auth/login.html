{% extends "base.html" %}
{% block title %}Log in — Wordle Tournament{% endblock %}

{% block content %}
<div style="text-align:center;margin-bottom:40px;margin-top:12px">
  <h1 style="font-family:'Arvo',Georgia,serif;font-size:42px;font-weight:700;letter-spacing:0.02em;line-height:1.1;margin-bottom:10px">
    Wordle<br>Tournament
  </h1>
  <p style="color:var(--t2);font-size:14px">Compete with friends on the NYT daily puzzle</p>
</div>

{% if error %}
  <div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('auth.login') }}">
  <div class="form-group">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="you@example.com"
      required
      autofocus
      value="{{ request.form.get('email', '') }}"
    >
  </div>
  <button type="submit" class="btn btn-primary">Send login code</button>
</form>

<p style="text-align:center;margin-top:28px;font-size:13px;color:var(--t2)">
  We'll email you a 6-digit code. No password needed.
</p>
{% endblock %}
