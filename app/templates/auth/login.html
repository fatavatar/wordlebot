{% extends "base.html" %}
{% block title %}Log in — Wordle Tournament{% endblock %}

{% block content %}
<div style="text-align:center;margin-bottom:32px">
  <h1 style="font-size:32px;letter-spacing:0.1em;text-transform:uppercase">Wordle<br>Tournament</h1>
  <p style="color:var(--color-tone-2);margin-top:8px">Sign in or create an account</p>
</div>

{% if error %}
  <div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('auth.login') }}">
  <div class="form-group">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="you@example.com"
      required
      autofocus
      value="{{ request.form.get('email', '') }}"
    >
  </div>
  <button type="submit" class="btn btn-primary">Send login code</button>
</form>

<p style="text-align:center;margin-top:24px;font-size:14px;color:var(--color-tone-2)">
  We'll email you a 6-digit code. No password needed.
</p>
{% endblock %}
